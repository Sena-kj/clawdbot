clawdbot:
  backtest:
    start-date: 2026-02-02
    end-date: 2026-02-09
  persistence:
    enabled: ${PERSISTENCE_ENABLED:false}
  binance:
    base-url: https://api.binance.com
    interval: 1d
    api-key: ${BINANCE_API_KEY:}
    secret-key: ${BINANCE_SECRET_KEY:}
  news:
    base-url: https://newsapi.org/v2
    api-key: ${NEWS_API_KEY:}
  cryptocompare:
    base-url: https://min-api.cryptocompare.com
    api-key: ${CRYPTOCOMPARE_API_KEY:}
  nlp:
    base-url: ${NLP_BASE_URL:http://localhost:8000}
  api:
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:clawdbot}
    jwt-expiration-minutes: ${JWT_EXP_MINUTES:120}
    api-key: ${API_KEY:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    max-requests: ${RATE_LIMIT_MAX:120}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    whitelist: ${RATE_LIMIT_WHITELIST:}
  validation:
    enabled: ${VALIDATION_ENABLED:true}
    strict: ${VALIDATION_STRICT:true}

spring:
  datasource:
    url: ${SUPABASE_DB_URL:}
    username: ${SUPABASE_DB_USER:}
    password: ${SUPABASE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${PERSISTENCE_ENABLED:false}
    baseline-on-migrate: true

---
spring:
  config:
    activate:
      on-profile: dev
clawdbot:
  api:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}

---
spring:
  config:
    activate:
      on-profile: prod
clawdbot:
  api:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://seu-dominio.com}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}

